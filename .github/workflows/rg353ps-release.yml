name: RG353PS native 640 frontend release (zh + en)

on:
  push:
    tags:
      - "rg353ps-v*"
    branches:
      - "publish/rg353ps-v2026.11.11"

permissions:
  contents: write

concurrency:
  group: rg353ps-native-640-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.language }} release package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [zh, en]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          path: slot

      - name: Checkout BaseOS device adapter
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-RG353PS
          ref: 0e47604f29d68cd4e06faf70c45e8e692e4102e3
          path: baseos

      - name: Validate native 640 tree
        run: |
          grep -Fqx 'pub const OUT_W: u32 = 640;' slot/crates/slot-gfx/src/surface.rs
          grep -Fqx 'pub const OUT_H: u32 = 480;' slot/crates/slot-gfx/src/surface.rs
          test -f baseos/platforms/rg353ps/frontends/slot/fbdev.rs
          sh -n slot/packaging/rg353ps/build.sh
          python3 -m py_compile slot/packaging/rg353ps/apply-rg353ps-input.py

      - name: Restore Rust dependency and target caches
        uses: actions/cache@v4
        with:
          path: |
            slot/work/rg353ps/cargo-registry
            slot/work/rg353ps/cargo-git
            slot/work/rg353ps/cargo-target
          key: rg353ps-native-640-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('slot/Cargo.lock', 'slot/rust-toolchain.toml') }}
          restore-keys: |
            rg353ps-native-640-cargo-${{ runner.os }}-

      - name: Build language-specific release ZIP
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: 0e47604f29d68cd4e06faf70c45e8e692e4102e3
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          SLOT_REPO: ${{ github.repository }}
          LANGUAGE: ${{ matrix.language }}
          PACKAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'rg353ps-v2026.11.11' }}
          INCLUDE_CORE_PACK: "yes"
          DIAGNOSTIC_NO_BOOT_SFX: "yes"
          RG353PS_WORK: ${{ github.workspace }}/slot/work/rg353ps
        run: sh slot/packaging/rg353ps/build.sh

      - name: Verify full package contains the default profile and pinned core pack
        run: |
          set -euo pipefail
          python3 - "slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-${{ github.ref_type == 'tag' && github.ref_name || 'rg353ps-v2026.11.11' }}-${{ matrix.language }}.zip" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          required_cores = {
              "mgba_libretro.so", "gpsp_libretro.so", "fceumm_libretro.so",
              "supafaust_libretro.so", "fbneo_libretro.so",
              "genesis_plus_gx_libretro.so", "pcsx_rearmed_libretro.so",
              "pce_fast_libretro.so",
          }
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              names = set(zf.namelist())
              required = {
                  "LUCKLUCK-SLOT/baseos-frontend.conf",
                  "LUCKLUCK-SLOT/launch.sh",
                  "LUCKLUCK-SLOT/profiles/640-native.conf",
                  "LUCKLUCK-SLOT/payload/System/slot",
                  "LUCKLUCK-SLOT/CORE-PACK-SOURCE.txt",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("package is missing: " + ", ".join(missing))
              profiles = sorted(
                  n for n in names
                  if n.startswith("LUCKLUCK-SLOT/profiles/") and n.endswith(".conf")
              )
              if profiles != ["LUCKLUCK-SLOT/profiles/640-native.conf"]:
                  raise SystemExit(f"expected one default profile, found: {profiles}")
              cores = {
                  n.rsplit("/", 1)[-1] for n in names
                  if n.startswith("LUCKLUCK-SLOT/payload/System/") and n.endswith("_libretro.so")
              }
              missing_cores = sorted(required_cores - cores)
              if missing_cores:
                  raise SystemExit("core pack is missing: " + ", ".join(missing_cores))
              runtime = [n for n in names if n.startswith("LUCKLUCK-SLOT/payload/System/lib/") and not n.endswith("/")]
              licenses = [n for n in names if n.startswith("LUCKLUCK-SLOT/payload/System/licenses/") and not n.endswith("/")]
              if not runtime:
                  raise SystemExit("core runtime libraries are missing")
              if not licenses:
                  raise SystemExit("core license/source files are missing")
              for name in ("LUCKLUCK-SLOT/README-RG353PS.txt", "LUCKLUCK-SLOT/BUILD-INFO.txt"):
                  content = zf.read(name).decode("utf-8")
                  if "pinned RG353PS AArch64/musl core pack" not in content:
                      raise SystemExit(f"{name} does not document the included core pack")
              print(f"Verified full package: {len(profiles)} default profile, {len(required_cores)} cores, {len(runtime)} runtime libraries and {len(licenses)} license files: {archive}")
          PY

      - name: Upload language package
        uses: actions/upload-artifact@v4
        with:
          name: rg353ps-native-640-${{ matrix.language }}
          path: |
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-${{ github.ref_type == 'tag' && github.ref_name || 'rg353ps-v2026.11.11' }}-${{ matrix.language }}.zip
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-${{ github.ref_type == 'tag' && github.ref_name || 'rg353ps-v2026.11.11' }}-${{ matrix.language }}.zip.sha256
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish paired Chinese and English packages
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download both language packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RG353PS_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'rg353ps-v2026.11.11' }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          test -f release-assets/LUCKLUCK-SLOT-RG353PS-640x480-${RG353PS_RELEASE_TAG}-zh.zip
          test -f release-assets/LUCKLUCK-SLOT-RG353PS-640x480-${RG353PS_RELEASE_TAG}-en.zip
          if gh release view "${RG353PS_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          # LUCKLUCK SLOT — RG353PS native 640×480
          
          This RG353PS port follows upstream LUCKLUCK SLOT **v2026.11.11** (source commit `25e39ec7131ac05fc5187181c4de77d75bedad7c`).
          
          ## 简体中文
          
          ### 上游 v2026.11.11
          - 支持 GBA、GB、GBC、FC、SFC、MD、PS1、PCE、街机和 NEOGEO，以及像素随身听、设置、存档槽位、即时存档浏览器、金手指和按键重映射。
          - **游戏首字母搜索：** 在游戏货架按 `SELECT + Y` 打开四层键盘，支持拼音首字母和游戏名原文片段实时筛选；方向键移动、`A` 输入、`B` 退格、`L1/R1` 换层；`X` 恢复全部、`START` 应用、`MENU` 取消。仅作用于游戏货架，不改变音乐/碟片货架。
          - **修复 B 键短按误触发 Wi-Fi 直连：** 松开 B 时清除长按跟踪状态；长按 B 的直连功能保留。
          - **键盘大小写显示：** Wi-Fi 密码键帽按原始字符绘制，保留小写/大写字形。
          
          ### RG353PS / BaseOS 移植
          - 原生 640×480 逻辑画布与布局，基于上游 640 源码树，不缩放 720×480 画面。
          - BaseOS SDL2/KMSDRM + GLES2 显示后端，运行于 RK3566 Panfrost。
          - 集成 RG353PS BaseOS managed package 元数据（`baseos-frontend.conf`）、默认 `640-native` Profile、启动脚本、MTP 辅助钩子，以及音量/电源所有权约定；需要多配置的用户可自行复制 Profile 配置创建。
          - 保留 RG353PS 实测按键映射、四轴摇杆参数、Wi-Fi、休眠/唤醒适配；HUD 字体后台解析。
          - 完整包包含固定版本的 AArch64/musl 模拟器核心、运行库、许可证和源码材料。
          - 正式包关闭前端默认 `Sfx::Boot` 提示音。此设置只抑制前端启动提示音，不关闭 ALSA、游戏音效或音乐，也不代表 BaseOS 开机画面阶段的功放上电噪声已解决。
          
          ### 资源与安装
          - `*-zh.zip`：简体中文完整包；`*-en.zip`：英文完整包；各自提供 `.sha256` 校验文件。
          - 将 ZIP 保留顶层目录解压到 BaseOS 数据分区的 `Frontends/` 目录；ROM 与电池存档分别放在数据分区根目录的 `Games/` 与 `Saves/`。更新前备份存档和自定义资源。
          - 为保证可复现构建，当前美术、字体、音乐、遮罩、开机图和网络脚本资源继续使用 SHA-256 固定的上游 v2026.11.09 数据包；前端可执行文件由 v2026.11.11 对应的 RG353PS 源码构建，不复制上游设备二进制。
          
          ## English
          
          ### Upstream v2026.11.11
          - Supports GBA, GB, GBC, FC, SFC, MD, PS1, PCE, Arcade and Neo Geo, plus the music player, settings, save slots, save-state browser, cheats and button remapping.
          - **Shelf search by initials:** press `SELECT + Y` on the game shelf to open the four-layer keyboard. Search by pinyin initials or a literal title substring; D-pad moves, `A` types, `B` erases and `L1/R1` changes layers. `X` restores all games, `START` applies and `MENU` cancels. The disc/music shelf is unchanged.
          - **Short B press fix:** releasing B clears the long-press tracker, so a tap no longer opens Wi-Fi direct connect; holding B still invokes direct connect.
          - **Keyboard case rendering:** Wi-Fi password keycaps are rasterized from the original character, preserving lowercase and uppercase glyphs.
          
          ### RG353PS / BaseOS port
          - Native 640×480 logical canvas and layout based on the upstream 640 source tree; not a scaled 720×480 build.
          - BaseOS SDL2/KMSDRM + GLES2 display backend on RK3566 Panfrost.
          - RG353PS BaseOS managed package metadata (`baseos-frontend.conf`), the default `640-native` profile, launcher, MTP helper hook, and volume/power ownership integration. Additional profiles are user-created by copying the profile config; the default package does not install duplicate profiles.
          - RG353PS-tested button mapping, four-axis joystick parameters, Wi-Fi and suspend/resume integration; HUD font parsing moved to a background worker.
          - Full packages include the pinned AArch64/musl emulator cores, runtime libraries, licence notices and source materials.
          - The release build disables the frontend's default `Sfx::Boot` cue only. ALSA, game effects and music remain enabled. This does not claim to fix the separate amplifier power-on noise during the BaseOS boot screen.
          
          ### Assets and installation
          - `*-zh.zip`: Simplified Chinese full package; `*-en.zip`: English full package. SHA-256 sidecars are provided.
          - Extract the ZIP into the BaseOS data partition's `Frontends/` directory, preserving the top-level `LUCKLUCK-SLOT/` folder. Keep ROMs and battery saves in the DATA-root `Games/` and `Saves/` folders. Back up saves and customised assets before updating.
          - For reproducible packaging, artwork, fonts, music, overlays, boot logos and the network helper remain pinned to the checksum-verified upstream v2026.11.09 data archive. The frontend executable is built from the RG353PS source synced to v2026.11.11; no upstream device binary is copied.
          
          ### Validation
          CI verifies the Chinese and English AArch64/musl builds, package contents and SHA-256 files. The Chinese integration CI package includes the pinned core pack. This bilingual release build uses the same core pack and validates the two language variants from the tagged source. CI success does not mean every system/game has completed hardware gameplay testing. The BaseOS boot-screen amplifier transient remains a separate hardware issue.
          
          This is a community RG353PS port and is not an official upstream hardware-support claim.
          
          Upstream release: https://github.com/RetroGame66/LUCKLUCK-SLOT/releases/tag/v2026.11.11
          NOTES
          gh release create "${RG353PS_RELEASE_TAG}" release-assets/*.zip release-assets/*.sha256 \
            --repo "dengzhan007/LUCKLUCK-SLOT-RG353PS" \
            --title "LUCKLUCK SLOT RG353PS 640×480 ${RG353PS_RELEASE_TAG}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"
