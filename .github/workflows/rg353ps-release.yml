name: RG353PS native 640 frontend release (zh + en)

on:
  push:
    tags:
      - "rg353ps-v*"

permissions:
  contents: write

concurrency:
  group: rg353ps-native-640-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.language }} release package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [zh, en]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          path: slot

      - name: Checkout BaseOS device adapter
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-RG353PS
          ref: 4353f0bcee34c3f9411c0399e370aa010901a765
          path: baseos

      - name: Validate native 640 tree
        run: |
          grep -Fqx 'pub const OUT_W: u32 = 640;' slot/crates/slot-gfx/src/surface.rs
          grep -Fqx 'pub const OUT_H: u32 = 480;' slot/crates/slot-gfx/src/surface.rs
          test -f baseos/platforms/rg353ps/frontends/slot/fbdev.rs
          sh -n slot/packaging/rg353ps/build.sh
          python3 -m py_compile slot/packaging/rg353ps/apply-rg353ps-input.py

      - name: Restore Rust dependency and target caches
        uses: actions/cache@v4
        with:
          path: |
            slot/work/rg353ps/cargo-registry
            slot/work/rg353ps/cargo-git
            slot/work/rg353ps/cargo-target
          key: rg353ps-native-640-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('slot/Cargo.lock', 'slot/rust-toolchain.toml') }}
          restore-keys: |
            rg353ps-native-640-cargo-${{ runner.os }}-

      - name: Build language-specific release ZIP
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: 4353f0bcee34c3f9411c0399e370aa010901a765
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          SLOT_REPO: ${{ github.repository }}
          LANGUAGE: ${{ matrix.language }}
          PACKAGE_TAG: ${{ github.ref_name }}
          DIAGNOSTIC_NO_BOOT_SFX: "yes"
          RG353PS_WORK: ${{ github.workspace }}/slot/work/rg353ps
        run: sh slot/packaging/rg353ps/build.sh

      - name: Upload language package
        uses: actions/upload-artifact@v4
        with:
          name: rg353ps-native-640-${{ matrix.language }}
          path: |
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-${{ github.ref_name }}-${{ matrix.language }}.zip
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-${{ github.ref_name }}-${{ matrix.language }}.zip.sha256
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish paired Chinese and English packages
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download both language packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          test -f release-assets/LUCKLUCK-SLOT-RG353PS-640x480-${GITHUB_REF_NAME}-zh.zip
          test -f release-assets/LUCKLUCK-SLOT-RG353PS-640x480-${GITHUB_REF_NAME}-en.zip
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
# LUCKLUCK SLOT — RG353PS native 640×480

This RG353PS port follows upstream LUCKLUCK SLOT **v2026.11.09**.

## 简体中文

### 上游 v2026.11.09
- 支持 GBA、GB、GBC、FC、SFC、MD、PS1、PCE、街机和 NEOGEO。
- 包含像素随身听、设置界面、存档槽位与即时存档浏览器、金手指和按键重映射。
- 提供按机种配置的显示遮罩、扫描线、色彩校正，以及主题、壁纸、卡带美术和开机画面。
- 修复跨机种同名游戏识别错误、音乐播放器启动后无法进入等问题。
- PS1 大镜像采用路径流式加载，降低内存占用。

### RG353PS 移植与修复
- 原生 640×480 布局，基于上游 `66-mods-640`，不是将 720×480 画面缩放适配。
- 使用 BaseOS SDL2/KMSDRM + GLES2 显示后端，适配 RK3566 Panfrost。
- 集成 BaseOS 前端适配器、`manifest.conf`、启动脚本及音量/电源所有权约定。
- 使用 RG353PS 实测按键映射和摇杆参数。
- 适配 RG353PS Wi-Fi、休眠与唤醒流程。
- 将 HUD 字体解析移至后台线程，减少首次绘制时的卡顿。
- 修复 Wi-Fi 密码软键盘小写字母显示为大写的问题。
- 关闭前端默认 `Sfx::Boot` 启动提示音；自定义 `System/boot_opening.slotvid` 音轨、游戏音效和音乐播放不受影响。

### 下载与安装
- `*-zh.zip`：简体中文完整包；`*-en.zip`：英文完整包。
- 对应 `.sha256` 文件用于校验下载完整性。
- 两个语言包均包含前端资源及固定版本的 RG353PS AArch64/musl 模拟器核心。解压后将目录合并到 BaseOS 数据分区根目录。更新前请备份存档和自定义资源。

## English

### Upstream v2026.11.09
- Supports GBA, GB, GBC, FC, SFC, MD, PS1, PCE, Arcade and Neo Geo.
- Includes the pixel music player, settings, save slots and save-state browser, cheats and button remapping.
- Per-system display masks, scanlines and colour correction, plus themes, wallpapers, cartridge art and boot logos.
- Fixes cross-system duplicate game-name resolution and the music-player startup issue.
- Streams large PS1 images by path to reduce memory use.

### RG353PS port changes
- Native 640×480 layout based on upstream `66-mods-640`, not a scaled 720×480 build.
- BaseOS SDL2/KMSDRM + GLES2 display backend for RK3566 Panfrost.
- BaseOS frontend adapter, `manifest.conf`, launcher, and volume/power ownership integration.
- RG353PS-tested button mapping and joystick parameters.
- RG353PS Wi-Fi and suspend/resume integration.
- HUD font parsing moved to a background thread to reduce first-frame stalls.
- Fixed lowercase letters rendering as uppercase in the Wi-Fi password keyboard.
- Disabled the default `Sfx::Boot` frontend startup chime. Custom `System/boot_opening.slotvid` audio, game effects and music playback remain enabled.

### Downloads and installation
- `*-zh.zip`: Simplified Chinese full package; `*-en.zip`: English full package.
- Matching `.sha256` files are provided for integrity verification.
- Both packages include frontend assets and the pinned RG353PS AArch64/musl emulator core pack. Merge extracted directories into the BaseOS data-partition root. Back up saves and customised assets before updating.

### Validation
CI confirms build and package integrity; it does not mean every system and game has completed hardware gameplay validation. This is an RG353PS community port, not an official upstream hardware-support claim.

Upstream source and full history: https://github.com/RetroGame66/LUCKLUCK-SLOT/releases/tag/v2026.11.09
NOTES
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/*.sha256 \
            --title "LUCKLUCK SLOT RG353PS 640×480 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"
