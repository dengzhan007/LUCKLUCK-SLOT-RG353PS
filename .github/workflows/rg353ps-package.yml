name: RG353PS native 640 frontend test (Chinese)

on:
  pull_request:
    branches:
      - port/rg353ps-640-native
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packaging/rg353ps/**"
      - ".github/workflows/rg353ps-package.yml"
  push:
    branches:
      - port/rg353ps-640-native
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packaging/rg353ps/**"
      - "PORTING-RG353PS.md"
      - ".github/workflows/rg353ps-package.yml"
  workflow_dispatch:
    inputs:
      baseos_ref:
        description: "BaseOS-RG353PS ref used for the device adapter"
        required: true
        default: "d66960f3c6465543646edee9771e278cd54dcc1a"

permissions:
  contents: read

concurrency:
  group: rg353ps-native-640-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build RG353PS native 640x480 frontend (Chinese / AArch64 musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout native 640 Slot source
        uses: actions/checkout@v4
        with:
          path: slot

      - name: Checkout BaseOS device adapter
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-RG353PS
          ref: ${{ inputs.baseos_ref || 'd66960f3c6465543646edee9771e278cd54dcc1a' }}
          path: baseos

      - name: Validate native 640 tree and BaseOS adapter
        run: |
          test -f slot/Cargo.toml
          test -f slot/rust-toolchain.toml
          grep -Fqx 'channel = "1.96"' slot/rust-toolchain.toml
          grep -Fqx 'pub const OUT_W: u32 = 640;' slot/crates/slot-gfx/src/surface.rs
          grep -Fqx 'pub const OUT_H: u32 = 480;' slot/crates/slot-gfx/src/surface.rs
          test -f slot/crates/slot/src/mtp.rs
          grep -Fq 'slot::mtp::start(&root);' slot/crates/slot/src/device_app.rs
          test -f baseos/platforms/rg353ps/frontends/slot/fbdev.rs
          test -f slot/packaging/rg353ps/apply-rg353ps-input.py
          python3 -m py_compile slot/packaging/rg353ps/apply-rg353ps-input.py
          test -f slot/packaging/rg353ps/patch-slotnet-rg353ps.py
          python3 -m py_compile slot/packaging/rg353ps/patch-slotnet-rg353ps.py
          cp slot/crates/slot/src/input/evdev.rs /tmp/evdev-rg353ps-check.rs
          python3 slot/packaging/rg353ps/apply-rg353ps-input.py /tmp/evdev-rg353ps-check.rs
          grep -Fq 'const STICK_RANGE: i32 = 504;' /tmp/evdev-rg353ps-check.rs
          grep -Fq 'ABS_X => (15, 1023, 527)' /tmp/evdev-rg353ps-check.rs
          grep -Fq 'ABS_Y => (15, 1023, 505)' /tmp/evdev-rg353ps-check.rs
          grep -Fq 'ABS_RX => (15, 1023, 517)' /tmp/evdev-rg353ps-check.rs
          grep -Fq 'ABS_RY => (15, 1023, 542)' /tmp/evdev-rg353ps-check.rs
          grep -Fq 'all_four_rg353ps_axes_use_the_upstream_slot_stick_directions' /tmp/evdev-rg353ps-check.rs
          grep -Fq '0x13c => Btn::Menu, // Function' /tmp/evdev-rg353ps-check.rs
          test -f baseos/platforms/rg353ps/frontends/slot/launch.sh
          test -f baseos/platforms/rg353ps/frontends/slot/baseos-frontend.conf
          test -f baseos/platforms/rg353ps/frontends/slot/profiles/640-native.conf
          test -f baseos/platforms/rg353ps/frontends/slot/profiles/640-native-alt.conf
          sh -n baseos/platforms/rg353ps/rootfs/usr/sbin/rg353ps-sleep
          grep -Fq 'modprobe rtw88_8821cs' baseos/platforms/rg353ps/rootfs/etc/init.d/rcS
          grep -Fq 'rfkill_dev in /sys/class/rfkill/rfkill*' baseos/platforms/rg353ps/rootfs/etc/init.d/rcS
          grep -Fq '[ "$rfkill_type" = wlan ]' baseos/platforms/rg353ps/rootfs/etc/init.d/rcS
          grep -Fq 'ip link set wlan0 up' baseos/platforms/rg353ps/rootfs/etc/init.d/rcS
          sh -n baseos/platforms/rg353ps/rootfs/etc/init.d/rcS
          grep -Fq 'System/slotnet.sh' baseos/platforms/rg353ps/rootfs/usr/sbin/rg353ps-sleep
          grep -Fq 'AGS_ROOT=$SLOT_ROOT' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fq 'mount --bind "$SDCARD/Games" "$SLOT_ROOT/Games"' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fq 'mount --bind "$SDCARD/Saves" "$SLOT_ROOT/Saves"' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fq 'for state_name in slot.state theme.txt' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fq 'mount --bind "$PROFILE_STATES_DIR" "$SLOT_ROOT/States"' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fq 'root.join(".userdata").join("slot.state")' slot/crates/slot-store/src/slot_state.rs
          grep -Fq 'const SELECTED_CORE_FILE: &str = ".userdata/selected_core.ini";' slot/crates/slot-store/src/core.rs
          grep -Fq 'const CACHE: &str = ".userdata/library.cache";' slot/crates/slot-store/src/scan.rs
          grep -Fq 'cargo test -p slot-store' slot/packaging/rg353ps/build.sh
          grep -Fq 'slot-userdata-seeded' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fqx 'export AGS_NET_MODULE=rtw88_8821cs' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fq 'AGS_ROOT="$FRONTEND_ROOT" "$FRONTEND_WIFI" down' baseos/platforms/rg353ps/rootfs/usr/sbin/rg353ps-sleep
          grep -Fq 'AGS_ROOT="$FRONTEND_ROOT" "$FRONTEND_WIFI" up' baseos/platforms/rg353ps/rootfs/usr/sbin/rg353ps-sleep
          ! grep -Fq 'BASEOS_WIFI' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fqx 'export BASEOS_SLEEP=/usr/sbin/rg353ps-sleep' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fqx 'package_api=1' baseos/platforms/rg353ps/frontends/slot/baseos-frontend.conf
          grep -Fqx 'volume_owner=frontend' baseos/platforms/rg353ps/frontends/slot/baseos-frontend.conf
          grep -Fqx 'power_owner=frontend' baseos/platforms/rg353ps/frontends/slot/baseos-frontend.conf
          grep -Fqx 'profile_api=1' baseos/platforms/rg353ps/frontends/slot/profiles/640-native.conf
          grep -Fqx 'profile_api=1' baseos/platforms/rg353ps/frontends/slot/profiles/640-native-alt.conf
          grep -Fqx '# baseos: volume-owned' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fqx '# baseos: power-owned' baseos/platforms/rg353ps/frontends/slot/launch.sh
          sh -n baseos/platforms/rg353ps/frontends/slot/launch.sh
          sh -n slot/packaging/rg353ps/build.sh
          sh -n slot/packaging/rg353ps/stage-upstream-assets.sh
          sh -n slot/packaging/rg353ps/stage-core-pack.sh

      - name: Restore Rust dependency and target caches
        uses: actions/cache@v4
        with:
          path: |
            slot/work/rg353ps/cargo-registry
            slot/work/rg353ps/cargo-git
            slot/work/rg353ps/cargo-target
          key: rg353ps-native-640-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('slot/Cargo.lock', 'slot/rust-toolchain.toml') }}
          restore-keys: |
            rg353ps-native-640-cargo-${{ runner.os }}-

      - name: Build Chinese core-free frontend test ZIP only
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: ${{ inputs.baseos_ref || 'd66960f3c6465543646edee9771e278cd54dcc1a' }}
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          SLOT_REPO: ${{ github.repository }}
          LANGUAGE: zh
          INCLUDE_CORE_PACK: "no"
          DIAGNOSTIC_NO_BOOT_SFX: "yes"
          PACKAGE_TAG: test-${{ github.run_number }}
          RG353PS_WORK: ${{ github.workspace }}/slot/work/rg353ps
        run: sh slot/packaging/rg353ps/build.sh

      - name: Verify test ZIP excludes emulator cores
        run: |
          set -euo pipefail
          python3 - "slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-test-${{ github.run_number }}-zh.zip" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              names = zf.namelist()
              required = {
                  "slot-rg353ps/baseos-frontend.conf",
                  "slot-rg353ps/launch.sh",
                  "slot-rg353ps/profiles/640-native.conf",
                  "slot-rg353ps/profiles/640-native-alt.conf",
                  "slot-rg353ps/payload/System/slot",
              }
              missing = sorted(required - set(names))
              if missing:
                  raise SystemExit("managed frontend package is missing: " + ", ".join(missing))
              if any(name.startswith("System/") or name.startswith(".baseos/frontends/") for name in names):
                  raise SystemExit("test ZIP still contains the legacy DATA-root install layout")
              if not any(name.startswith("slot-rg353ps/payload/") for name in names):
                  raise SystemExit("test ZIP has no managed frontend payload")
              cores = [name for name in names if name.endswith("_libretro.so")]
              if cores:
                  raise SystemExit("test ZIP unexpectedly contains emulator cores: " + ", ".join(cores))
              if "slot-rg353ps/CORE-PACK-SOURCE.txt" in names:
                  raise SystemExit("test ZIP unexpectedly contains core-pack metadata")
              if any(name.startswith("System/lib/") for name in names):
                  raise SystemExit("test ZIP unexpectedly contains core runtime libraries")
              readme = zf.read("slot-rg353ps/README-RG353PS.txt").decode("utf-8")
              if "intentionally excluded" not in readme:
                  raise SystemExit("package README does not identify this as a core-free package")
              if ".userdata/" not in readme or "time zone" not in readme or "selected_core.ini" not in readme:
                  raise SystemExit("package README does not describe per-profile settings and core-choice persistence")
              info = zf.read("slot-rg353ps/BUILD-INFO.txt").decode("utf-8")
              if "intentionally excluded" not in info:
                  raise SystemExit("BUILD-INFO does not confirm the core-free package")
              profiles = [name for name in names if name.startswith("slot-rg353ps/profiles/") and name.endswith(".conf")]
              if len(profiles) != 2:
                  raise SystemExit(f"expected two independent frontend profiles, found {len(profiles)}: {profiles}")
              print(f"Verified core-free managed package with {len(profiles)} profiles: {archive} ({len(names)} members)")
          PY
      - name: Upload Chinese test package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: luckluck-slot-rg353ps-640x480-test-zh-${{ github.run_number }}
          path: |
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-test-${{ github.run_number }}-zh.zip
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-test-${{ github.run_number }}-zh.zip.sha256
          if-no-files-found: error
          retention-days: 14
