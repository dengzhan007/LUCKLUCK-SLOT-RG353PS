name: 66slot RG353PS 640x480 test package

on:
  push:
    branches:
      - port/rg353ps-640x480
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packaging/rg353ps/**"
      - "PORTING-RG353PS-66SLOT.md"
      - ".github/workflows/rg353ps-package.yml"
  workflow_dispatch:
    inputs:
      baseos_ref:
        description: "BaseOS-RG353PS ref used for the device adapter"
        required: true
        default: "4353f0bcee34c3f9411c0399e370aa010901a765"

permissions:
  contents: read

concurrency:
  group: slot-66-rg353ps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build RG353PS frontend test ZIP (AArch64/musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Slot-66 source
        uses: actions/checkout@v4
        with:
          path: slot

      - name: Check out BaseOS device adapter
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-RG353PS
          ref: ${{ inputs.baseos_ref || '4353f0bcee34c3f9411c0399e370aa010901a765' }}
          path: baseos

      - name: Validate adapter inputs and source toolchain
        run: |
          test -f slot/Cargo.toml
          test -f slot/rust-toolchain.toml
          grep -Fqx 'channel = "1.96"' slot/rust-toolchain.toml
          test -f baseos/platforms/rg353ps/frontends/slot/fbdev.rs
          test -f slot/packaging/rg353ps/apply-rg353ps-input.py
          python3 -m py_compile slot/packaging/rg353ps/apply-rg353ps-input.py
          test -f baseos/platforms/rg353ps/frontends/slot/launch.sh
          test -f baseos/platforms/rg353ps/frontends/slot/manifest.conf
          grep -Fqx 'adapter_api=1' baseos/platforms/rg353ps/frontends/slot/manifest.conf
          grep -Fqx 'volume_owner=frontend' baseos/platforms/rg353ps/frontends/slot/manifest.conf
          grep -Fqx 'power_owner=frontend' baseos/platforms/rg353ps/frontends/slot/manifest.conf
          grep -Fqx '# baseos: volume-owned' baseos/platforms/rg353ps/frontends/slot/launch.sh
          grep -Fqx '# baseos: power-owned' baseos/platforms/rg353ps/frontends/slot/launch.sh
          sh -n slot/packaging/rg353ps/build.sh

      - name: Restore Cargo caches
        uses: actions/cache@v4
        with:
          path: |
            slot/work/rg353ps/cargo-registry
            slot/work/rg353ps/cargo-git
            slot/work/rg353ps/cargo-target
          key: slot-66-rg353ps-cargo-${{ runner.os }}-${{ hashFiles('slot/Cargo.lock', 'slot/rust-toolchain.toml') }}
          restore-keys: |
            slot-66-rg353ps-cargo-${{ runner.os }}-

      - name: Set up AArch64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build frontend-only package
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: ${{ inputs.baseos_ref || '4353f0bcee34c3f9411c0399e370aa010901a765' }}
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          RG353PS_WORK: ${{ github.workspace }}/slot/work/rg353ps
        run: sh slot/packaging/rg353ps/build.sh

      - name: Upload test package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: slot-66-rg353ps-640x480-test-${{ github.run_number }}
          path: |
            slot/work/rg353ps/frontends/slot-66-rg353ps-640x480-test.zip
            slot/work/rg353ps/frontends/slot-66-rg353ps-640x480-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
