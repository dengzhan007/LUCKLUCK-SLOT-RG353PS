name: RG353PS audio diagnostic (mute Slot Boot SFX)

on:
  push:
    branches:
      - port/rg353ps-640-native
    paths:
      - "crates/slot/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packaging/rg353ps/**"
      - ".github/workflows/rg353ps-audio-diagnostic.yml"
  workflow_dispatch:
    inputs:
      baseos_ref:
        description: "BaseOS-RG353PS adapter revision (tested 1.2.7 source)"
        required: true
        default: "4353f0bcee34c3f9411c0399e370aa010901a765"

permissions:
  contents: read

concurrency:
  group: rg353ps-audio-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Chinese RG353PS audio diagnostic frontend (AArch64 musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout Slot source
        uses: actions/checkout@v4
        with:
          path: slot

      - name: Checkout BaseOS 1.2.7 adapter
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-RG353PS
          ref: ${{ inputs.baseos_ref || '4353f0bcee34c3f9411c0399e370aa010901a765' }}
          path: baseos

      - name: Validate diagnostic-only source and adapter
        run: |
          set -eu
          test -f slot/Cargo.toml
          grep -Fqx 'diag-no-boot-sfx = []' slot/crates/slot/Cargo.toml
          grep -Fq '#[cfg(feature = "diag-no-boot-sfx")]' slot/crates/slot/src/frontend.rs
          grep -Fq 'Sfx::Boot suppressed; ALSA sink open path unchanged' slot/crates/slot/src/device_app.rs
          test -f baseos/platforms/rg353ps/frontends/slot/fbdev.rs
          test -f baseos/platforms/rg353ps/frontends/slot/launch.sh
          test -f baseos/platforms/rg353ps/frontends/slot/manifest.conf
          sh -n slot/packaging/rg353ps/build.sh
          sh -n slot/packaging/rg353ps/stage-upstream-assets.sh
          sh -n slot/packaging/rg353ps/stage-core-pack.sh
          grep -Fqx 'pub const OUT_W: u32 = 640;' slot/crates/slot-gfx/src/surface.rs
          grep -Fqx 'pub const OUT_H: u32 = 480;' slot/crates/slot-gfx/src/surface.rs
          grep -Fqx 'adapter_api=1' baseos/platforms/rg353ps/frontends/slot/manifest.conf
          grep -Fqx 'volume_owner=frontend' baseos/platforms/rg353ps/frontends/slot/manifest.conf
          grep -Fqx 'power_owner=frontend' baseos/platforms/rg353ps/frontends/slot/manifest.conf

      - name: Restore Rust dependency and target caches
        uses: actions/cache@v4
        with:
          path: |
            slot/work/rg353ps/cargo-registry
            slot/work/rg353ps/cargo-git
            slot/work/rg353ps/cargo-target
          key: rg353ps-native-640-audio-diag-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('slot/Cargo.lock', 'slot/rust-toolchain.toml') }}
          restore-keys: |
            rg353ps-native-640-cargo-${{ runner.os }}-

      - name: Build Chinese core-free audio diagnostic ZIP
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: ${{ inputs.baseos_ref || '4353f0bcee34c3f9411c0399e370aa010901a765' }}
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          SLOT_REPO: ${{ github.repository }}
          LANGUAGE: zh
          INCLUDE_CORE_PACK: "no"
          DIAGNOSTIC_NO_BOOT_SFX: "yes"
          PACKAGE_TAG: audio-diag-no-boot-sfx-${{ github.run_number }}
          RG353PS_WORK: ${{ github.workspace }}/slot/work/rg353ps
        run: sh slot/packaging/rg353ps/build.sh

      - name: Verify diagnostic ZIP and core exclusion
        run: |
          set -euo pipefail
          python3 - "slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-audio-diag-no-boot-sfx-${{ github.run_number }}-zh.zip" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              names = zf.namelist()
              cores = [n for n in names if n.endswith("_libretro.so")]
              if cores:
                  raise SystemExit("test ZIP unexpectedly contains emulator cores: " + ", ".join(cores))
              if "CORE-PACK-SOURCE.txt" in names or any(n.startswith("System/lib/") for n in names):
                  raise SystemExit("test ZIP unexpectedly contains core metadata or runtime libraries")
              readme = zf.read("README-RG353PS.txt").decode("utf-8")
              info = zf.read("BUILD-INFO.txt").decode("utf-8")
              for label, content in (("README", readme), ("BUILD-INFO", info)):
                  if "Sfx::Boot is suppressed at compile time" not in content:
                      raise SystemExit(f"{label} does not identify the boot-SFX diagnostic build")
                  if "ALSA device open" not in content:
                      raise SystemExit(f"{label} does not state that ALSA remains enabled")
              print(f"Verified diagnostic, core-free ZIP: {archive} ({len(names)} members)")
          PY

      - name: Upload Chinese audio diagnostic package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: luckluck-slot-rg353ps-audio-diag-no-boot-sfx-${{ github.run_number }}-zh
          path: |
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-audio-diag-no-boot-sfx-${{ github.run_number }}-zh.zip
            slot/work/rg353ps/frontends/LUCKLUCK-SLOT-RG353PS-640x480-audio-diag-no-boot-sfx-${{ github.run_number }}-zh.zip.sha256
          if-no-files-found: error
          retention-days: 14
