name: RG353PS native 640 frontend release

on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rg353ps-frontend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build complete RG353PS 640x480 frontend (Chinese + English + cores)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          path: slot

      - name: Checkout BaseOS 1.2.8 adapter
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-RG353PS
          ref: release/1.2.8
          path: baseos

      - name: Verify build tools
        run: |
          set -eu
          docker version
          command -v curl
          command -v unzip
          command -v sha256sum
          command -v file

      - name: Resolve release version
        id: version
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/*) tag="${GITHUB_REF_NAME#release/}" ;;
            *) tag="v2026.11.09" ;;
          esac
          case "$tag" in
            v2026.11.09) package_tag=V20261109-RG353PS ;;
            *) echo "unexpected RG353PS release tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package_tag=$package_tag" >> "$GITHUB_OUTPUT"

      - name: Build Chinese package with pinned emulator cores
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: release/1.2.8
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          SLOT_REPO: ${{ github.repository }}
          LANGUAGE: zh
          PACKAGE_TAG: ${{ steps.version.outputs.package_tag }}
          RG353PS_WORK: ${{ github.workspace }}/work/rg353ps
        run: |
          cd slot
          sh packaging/rg353ps/build.sh

      - name: Build English package with pinned emulator cores
        env:
          BASEOS_ROOT: ${{ github.workspace }}/baseos
          BASEOS_REF: release/1.2.8
          SLOT_REV: ${{ github.sha }}
          SLOT_BRANCH: ${{ github.ref_name }}
          SLOT_REPO: ${{ github.repository }}
          LANGUAGE: en
          PACKAGE_TAG: ${{ steps.version.outputs.package_tag }}
          RG353PS_WORK: ${{ github.workspace }}/work/rg353ps
        run: |
          cd slot
          sh packaging/rg353ps/build.sh

      - name: Name and verify release assets
        env:
          PACKAGE_TAG: ${{ steps.version.outputs.package_tag }}
        run: |
          set -eu
          mkdir -p release-assets
          work="work/rg353ps/frontends"
          zh="LUCKLUCK-SLOT-RG353PS-640x480-${PACKAGE_TAG}-zh.zip"
          en="LUCKLUCK-SLOT-RG353PS-640x480-${PACKAGE_TAG}-en.zip"
          cp "$work/$zh" "release-assets/66slot-frontend-System-640480-V20261109-RG353PS.zip"
          cp "$work/$en" "release-assets/66slot-frontend-System-640480-V20261109-RG353PS-en.zip"
          python3 - release-assets <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          required = [
              "System/slot",
              "System/mgba_libretro.so",
              "System/gpsp_libretro.so",
              "System/fceumm_libretro.so",
              "System/supafaust_libretro.so",
              "System/fbneo_libretro.so",
              "System/genesis_plus_gx_libretro.so",
              "System/pcsx_rearmed_libretro.so",
              "System/pce_fast_libretro.so",
              "System/lib",
              "System/licenses",
              "CORE-PACK-SOURCE.txt",
          ]
          for archive in sorted(root.glob("*.zip")):
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"{archive}: corrupt member {bad}")
                  names = set(z.namelist())
                  missing = [p for p in required if not any(n == p or n.endswith("/" + p) or n.startswith(p + "/") for n in names)]
                  if missing:
                      raise SystemExit(f"{archive}: missing required package paths: {missing}")
                  print(f"verified {archive.name}: {len(names)} members")
          PY
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Upload complete RG353PS frontend packages
        uses: actions/upload-artifact@v4
        with:
          name: luckluck-slot-rg353ps-v2026.11.09-complete
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: luckluck-slot-rg353ps-v2026.11.09-complete
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/*) tag="${GITHUB_REF_NAME#release/}" ;;
            *) exit 1 ;;
          esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "LUCKLUCK SLOT RG353PS $tag" \
              --notes-file RELEASE-v2026.11.09.md \
              --target "$GITHUB_SHA"
          fi
